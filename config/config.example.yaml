app:
  name: "Kurum Yedekleme"
  language: "tr"
  data_dir: "./data"
  log_dir: "./logs"

# Tüm yedekler yalnızca E: diskinde tutulur
backup_root: "E:\\Yedekler"

schedule:
  enabled: true
  time: "02:00"

retry:
  max_attempts: 3
  initial_delay_seconds: 10
  backoff_multiplier: 2

zip:
  compresslevel: 6
  exclude_patterns:
    - "*.tmp"
    - "~$*"
    - "Thumbs.db"

logging:
  level: "INFO"
  rotation: "size"
  max_bytes: 5242880
  backup_count: 10
